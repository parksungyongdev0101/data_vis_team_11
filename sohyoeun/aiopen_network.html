<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AIOpen — 남을 역량 네트워크 (더미 + 필터)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b0d18;color:#c8cde8;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px 20px 36px}
  h1{font-size:17px;color:#fff;font-weight:600}
  .sub{font-size:11px;color:#8990b8;margin:3px 0 4px;text-align:center}
  .src{font-size:10px;color:#4a5290;margin-bottom:12px}

  /* filter bar */
  .filters{display:flex;gap:26px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap;justify-content:center;
    background:#111426;border:1px solid #232843;border-radius:10px;padding:12px 18px;max-width:860px}
  .fgroup{display:flex;flex-direction:column;gap:7px}
  .fgroup .flabel{font-size:10px;color:#9aa1c8;text-transform:uppercase;letter-spacing:.09em;font-weight:700}
  .roles{display:flex;flex-wrap:wrap;gap:6px;max-width:520px}
  .role-chip{display:flex;align-items:center;gap:5px;font-size:11px;color:#aab0d8;cursor:pointer;
    background:#181c33;border:1px solid #2a2f50;border-radius:16px;padding:4px 10px;user-select:none;transition:all .15s}
  .role-chip.on{background:#2a3160;border-color:#4a5290;color:#fff}
  .role-chip .dot{width:8px;height:8px;border-radius:50%;background:#566}
  .role-chip.on .dot{background:#7c8cff}
  .role-tools{display:flex;gap:8px;margin-top:2px}
  .role-tools button{font-size:10px;color:#8990b8;background:none;border:none;cursor:pointer;text-decoration:underline}

  .range-wrap{width:230px}
  .range{position:relative;height:30px;margin-top:6px}
  .range .track{position:absolute;top:13px;left:0;right:0;height:4px;background:#2a2f50;border-radius:2px}
  .range .fill{position:absolute;top:13px;height:4px;background:#5a6bd8;border-radius:2px}
  .range input[type=range]{position:absolute;top:0;left:0;width:100%;height:30px;margin:0;background:none;
    -webkit-appearance:none;appearance:none;pointer-events:none}
  .range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;
    border-radius:50%;background:#cdd3f5;border:2px solid #5a6bd8;cursor:pointer;margin-top:0}
  .range input[type=range]::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;
    background:#cdd3f5;border:2px solid #5a6bd8;cursor:pointer}
  .rlab{font-size:12px;color:#cdd3f5;font-weight:600;margin-top:2px}

  .wrap{position:relative}
  svg{overflow:visible}
  .empty-note{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);font-size:12px;color:#5a6090;display:none}

  .link{stroke:#2a2f50;stroke-opacity:.5}
  .node circle{cursor:pointer}
  .cat-label{font-size:12px;font-weight:700;fill:#fff;pointer-events:none;text-anchor:middle}
  .sub-label{font-size:9.5px;fill:#aab0d8;pointer-events:none;text-anchor:middle}

  .legend{display:flex;gap:13px;flex-wrap:wrap;justify-content:center;margin-top:12px;max-width:800px}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:#a8aedb;cursor:pointer}
  .legend-sw{width:11px;height:11px;border-radius:50%}

  .popup{position:fixed;width:280px;background:#141733;border:1px solid #39406e;border-radius:11px;padding:0;
    opacity:0;pointer-events:none;transition:opacity .12s;z-index:50;box-shadow:0 10px 30px #000a;overflow:hidden}
  .pop-head{padding:11px 14px 9px;border-bottom:1px solid #262b50}
  .pop-cat{font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:3px}
  .pop-name{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
  .pop-count{font-size:11px;color:#8990b8;margin-top:3px}
  .pop-count b{color:#dfe3fb}
  .pop-body{padding:9px 14px 12px;max-height:230px;overflow-y:auto}
  .pop-body .qlabel{font-size:9px;color:#6f77a4;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
  .quote{font-size:11.5px;color:#d2d7f5;line-height:1.5;padding:7px 9px;background:#1b1f3d;border-radius:7px;
    margin-bottom:6px;border-left:2px solid #555}
  .quote .meta{display:block;font-size:9.5px;color:#7c83ad;margin-top:4px}
</style>
</head>
<body>
<h1>AI 시대에 남을 역량 — 개발자들이 직접 말한 것</h1>
<div class="sub">카테고리 → 세부 역량 · 원 크기 = (필터된) 언급한 사람 수 · 호버 시 실제 답변</div>
<div class="src">※ 더미 데이터 예시 · 필터는 노드별 분야/연차 분포를 가정해 작동</div>

<div class="filters">
  <div class="fgroup">
    <span class="flabel">분야 / 역할 (다중 선택)</span>
    <div class="roles" id="roles"></div>
    <div class="role-tools"><button id="rAll">전체</button><button id="rNone">해제</button></div>
  </div>
  <div class="fgroup">
    <span class="flabel">연차 범위</span>
    <div class="range-wrap">
      <div class="range">
        <div class="track"></div><div class="fill" id="fill"></div>
        <input type="range" id="rmin" min="0" max="30" value="0">
        <input type="range" id="rmax" min="0" max="30" value="30">
      </div>
      <div class="rlab" id="rlab">0 ~ 30년+</div>
    </div>
  </div>
</div>

<div class="wrap">
  <svg id="net" width="820" height="560"></svg>
  <div class="empty-note" id="emptyNote">선택된 분야가 없습니다</div>
  <div class="popup" id="popup"></div>
</div>
<div class="legend" id="legend"></div>

<script>
// ---------- 분야/역할 ----------
const ROLES=[
  {id:"fs",name:"Full-stack"},{id:"be",name:"Back-end"},{id:"fe",name:"Front-end"},
  {id:"mob",name:"Mobile"},{id:"data",name:"Data/ML"},{id:"devops",name:"DevOps"},
  {id:"emb",name:"Embedded"},{id:"mgr",name:"Manager"},
];
// 연차 버킷 구간(연속) + per-node 분포 가중
const BUCKETS=[[0,2],[2,5],[5,10],[10,20],[20,30]];

// ---------- 더미 데이터 ----------
const CATS=[
  {id:"problem",name:"문제 해결 & 사고력",color:"#f97316"},
  {id:"design", name:"시스템 설계 & 아키텍처",color:"#4e9af1"},
  {id:"comm",   name:"커뮤니케이션 & 협업",color:"#a78bfa"},
  {id:"domain", name:"도메인 & 비즈니스 이해",color:"#34d399"},
  {id:"fund",   name:"CS 기초 역량",color:"#facc15"},
  {id:"ai",     name:"AI 활용 & 검증",color:"#ec4899"},
  {id:"adapt",  name:"적응력 & 학습",color:"#22d3ee"},
];
// emph=과대언급 역할, expW=연차버킷 가중[0-2,2-5,5-10,10-20,20-30]
const SUBS=[
  {id:"decompose",cat:"problem",name:"문제 분해",count:3900,emph:["be","fs","data"],expW:[.1,.2,.3,.25,.15],quotes:[
    {t:"AI can write functions, but breaking a vague business problem into solvable pieces is still on me.",m:"Back-end · 12 yrs"},
    {t:"가장 중요한 건 문제를 잘게 쪼개는 능력. 그건 AI가 대신 못 해준다.",m:"Full-stack · 7 yrs"}]},
  {id:"critical",cat:"problem",name:"비판적 사고",count:3600,emph:["data","be","mgr"],expW:[.05,.15,.25,.3,.25],quotes:[
    {t:"Critical thinking — knowing when the AI's answer is plausible but wrong.",m:"Data/ML · 9 yrs"},
    {t:"AI가 그럴듯한 답을 줄수록, 그걸 의심하고 검증하는 사고력이 더 중요해진다.",m:"Architect · 15 yrs"}]},
  {id:"debug",cat:"problem",name:"디버깅 추론",count:2800,emph:["be","emb","fs"],expW:[.2,.3,.25,.15,.1],quotes:[
    {t:"Debugging is reasoning about cause and effect — AI guesses, humans verify.",m:"Embedded · 11 yrs"}]},
  {id:"algo",cat:"problem",name:"알고리즘적 사고",count:1600,emph:["be","data"],expW:[.3,.3,.2,.12,.08],quotes:[
    {t:"Understanding the actual algorithmic complexity behind generated code.",m:"Back-end · 6 yrs"}]},

  {id:"arch",cat:"design",name:"아키텍처 설계",count:3300,emph:["be","mgr","devops"],expW:[.02,.08,.2,.4,.3],quotes:[
    {t:"System design decisions — AI can't see the whole picture or 5 years ahead.",m:"Architect · 18 yrs"},
    {t:"전체 구조를 설계하고 컴포넌트 경계를 정하는 건 여전히 사람 몫.",m:"Eng. manager · 14 yrs"}]},
  {id:"tradeoff",cat:"design",name:"트레이드오프 판단",count:2400,emph:["be","devops","mgr"],expW:[.03,.1,.25,.37,.25],quotes:[
    {t:"Weighing trade-offs: cost vs latency vs maintainability. AI gives options, I decide.",m:"Cloud · 10 yrs"}]},
  {id:"scale",cat:"design",name:"확장성 · 성능",count:1700,emph:["be","devops","data"],expW:[.05,.12,.3,.35,.18],quotes:[
    {t:"Knowing why something won't scale before you build it.",m:"Back-end · 13 yrs"}]},

  {id:"requirements",cat:"comm",name:"요구사항 소통",count:2600,emph:["fs","mgr","fe"],expW:[.08,.18,.28,.28,.18],quotes:[
    {t:"Translating fuzzy stakeholder needs into something buildable. That's a human conversation.",m:"Full-stack · 8 yrs"},
    {t:"고객이 진짜 원하는 게 뭔지 끌어내는 커뮤니케이션 능력.",m:"PM/IC · 9 yrs"}]},
  {id:"review",cat:"comm",name:"리뷰 & 피드백",count:1900,emph:["be","mgr"],expW:[.03,.12,.25,.35,.25],quotes:[
    {t:"Reviewing code (including AI's) and giving feedback that teaches, not just corrects.",m:"Senior · 16 yrs"}]},
  {id:"mentor",cat:"comm",name:"멘토링",count:1500,emph:["mgr"],expW:[.0,.03,.15,.42,.4],quotes:[
    {t:"Mentoring juniors — passing on judgment that no model has.",m:"Eng. manager · 20 yrs"}]},

  {id:"domainknow",cat:"domain",name:"도메인 지식",count:2500,emph:["data","be"],expW:[.05,.13,.3,.32,.2],quotes:[
    {t:"Deep domain knowledge. AI doesn't know our industry's weird rules.",m:"Back-end · 12 yrs"},
    {t:"우리 업계 특유의 규제와 맥락은 AI가 모른다.",m:"Desktop · 17 yrs"}]},
  {id:"product",cat:"domain",name:"제품 · 사용자 감각",count:1700,emph:["fe","fs","mob"],expW:[.1,.2,.3,.25,.15],quotes:[
    {t:"Understanding what users actually need vs what they ask for.",m:"Front-end · 7 yrs"}]},

  {id:"dsa",cat:"fund",name:"자료구조 · 알고리즘",count:2200,emph:["be","data"],expW:[.35,.28,.18,.12,.07],quotes:[
    {t:"Fundamentals never go away — you can't review AI code you don't understand.",m:"Student · 2 yrs"}]},
  {id:"systems",cat:"fund",name:"OS · 네트워크 기초",count:1300,emph:["emb","devops","be"],expW:[.1,.18,.3,.27,.15],quotes:[
    {t:"Knowing what happens under the hood when the abstraction leaks.",m:"Embedded · 14 yrs"}]},

  {id:"prompt",cat:"ai",name:"프롬프트 엔지니어링",count:1800,emph:["fs","fe"],expW:[.25,.3,.25,.13,.07],quotes:[
    {t:"Knowing how to direct the AI — prompting is the new interface.",m:"Full-stack · 5 yrs"},
    {t:"AI에게 정확히 요구하는 능력 자체가 새로운 역량.",m:"Front-end · 4 yrs"}]},
  {id:"verify",cat:"ai",name:"AI 출력 검증",count:1900,emph:["data","be"],expW:[.08,.18,.3,.28,.16],quotes:[
    {t:"The skill is verifying AI output, not producing the first draft.",m:"Data/ML · 8 yrs"}]},
  {id:"limits",cat:"ai",name:"AI 한계 이해",count:1200,emph:["be","data","devops"],expW:[.03,.1,.25,.35,.27],quotes:[
    {t:"Knowing what AI is bad at is more valuable than knowing what it's good at.",m:"Architect · 19 yrs"}]},

  {id:"learn",cat:"adapt",name:"빠른 학습력",count:1900,emph:["fs","fe","mob"],expW:[.3,.28,.2,.14,.08],quotes:[
    {t:"The ability to learn anything fast — tools change, learning doesn't.",m:"Full-stack · 6 yrs"},
    {t:"기술 스택은 계속 바뀐다. 새로 배우는 능력이 핵심.",m:"Mobile · 5 yrs"}]},
  {id:"curious",cat:"adapt",name:"호기심 · 적응",count:1100,emph:["fs","mob"],expW:[.25,.27,.25,.15,.08],quotes:[
    {t:"Curiosity. Staying adaptable when the ground keeps shifting.",m:"Back-end · 10 yrs"}]},
];

// ---------- 상태 ----------
let selRoles=new Set(ROLES.map(r=>r.id));   // 기본 전체
let yMin=0, yMax=30;

// per-node role weights: emph역할=2.5, 그 외=1
function roleSum(node, roleSet){
  let s=0; ROLES.forEach(r=>{ if(roleSet.has(r.id)) s += node.emph.includes(r.id)?2.5:1; }); return s;
}
const ALLROLES=new Set(ROLES.map(r=>r.id));
function roleFrac(node){ const all=roleSum(node,ALLROLES); return all? roleSum(node,selRoles)/all : 0; }
function overlap(a,b,c,d){ return Math.max(0, Math.min(b,d)-Math.max(a,c)); }
function expFrac(node){
  let num=0,den=0;
  BUCKETS.forEach((bk,i)=>{ const len=bk[1]-bk[0]; const w=node.expW[i];
    den+=w; num += w*(overlap(bk[0],bk[1],yMin,yMax)/len); });
  return den? num/den : 0;
}
function fcountSub(node){ return Math.round(node.count*roleFrac(node)*expFrac(node)); }

// ---------- 그래프 ----------
const W=820,H=560;
const svg=d3.select("#net").attr("width",W).attr("height",H);
const catById=Object.fromEntries(CATS.map(c=>[c.id,c]));
CATS.forEach((c,i)=>{ const a=(i/CATS.length)*2*Math.PI-Math.PI/2;
  c.fxc=W/2+Math.cos(a)*250; c.fyc=H/2+Math.sin(a)*185; });

const nodes=[...CATS.map(c=>({...c,type:"cat"})),...SUBS.map(s=>({...s,type:"sub",color:catById[s.cat].color}))];
const subByCat={}; SUBS.forEach(s=>(subByCat[s.cat]=subByCat[s.cat]||[]).push(s.id));
const links=SUBS.map(s=>({source:s.cat,target:s.id}));
const nodeById=Object.fromEntries(nodes.map(n=>[n.id,n]));

let rScale=d3.scaleSqrt().domain([0,3900]).range([5,46]);
function radius(n){ return Math.max(n.type==="cat"?9:5, rScale(n.fcount||0)); }

const linkSel=svg.append("g").selectAll("line").data(links).join("line").attr("class","link");
const nodeG=svg.append("g").selectAll("g").data(nodes).join("g").attr("class","node");
nodeG.append("circle").attr("fill",d=>d.type==="cat"?d.color:d.color+"cc")
  .attr("fill-opacity",d=>d.type==="cat"?.92:.62).attr("stroke",d=>d.color).attr("stroke-width",d=>d.type==="cat"?2.5:1.4);
nodeG.append("text").attr("class",d=>d.type==="cat"?"cat-label":"sub-label").text(d=>d.name);

const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(50).strength(.6))
  .force("charge",d3.forceManyBody().strength(d=>d.type==="cat"?-400:-120))
  .force("collide",d3.forceCollide(d=>radius(d)+(d.type==="cat"?20:13)))
  .force("x",d3.forceX(d=>catById[d.type==="cat"?d.id:d.cat].fxc).strength(.18))
  .force("y",d3.forceY(d=>catById[d.type==="cat"?d.id:d.cat].fyc).strength(.18))
  .on("tick",ticked);

function ticked(){
  linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeG.attr("transform",d=>`translate(${d.x},${d.y})`);
}
nodeG.call(d3.drag()
  .on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y;})
  .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y;})
  .on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null;}));

// ---------- 필터 적용 ----------
function recompute(){
  const noRole = selRoles.size===0;
  document.getElementById("emptyNote").style.display = noRole?"block":"none";
  // sub fcounts
  SUBS.forEach(s=>{ nodeById[s.id].fcount = noRole?0:fcountSub(s); });
  CATS.forEach(c=>{ nodeById[c.id].fcount = d3.sum(subByCat[c.id], id=>nodeById[id].fcount); });
  const maxF=d3.max(nodes,n=>n.fcount)||1;
  rScale.domain([0,maxF]);
  const vis=n=> n.fcount>=Math.max(20,maxF*0.015);
  nodeG.select("circle").transition().duration(500).attr("r",d=>radius(d))
    .attr("opacity",d=> vis(d)?1:0);
  nodeG.select("circle").style("pointer-events",d=>vis(d)?"all":"none");
  nodeG.select("text").transition().duration(500)
    .attr("dy",d=>d.type==="cat"?".32em":radius(d)+11)
    .attr("opacity",d=>vis(d)?1:0);
  linkSel.transition().duration(500).attr("opacity",d=> (vis(d.source)&&vis(d.target))?1:0);
  sim.force("collide").radius(d=>radius(d)+(d.type==="cat"?20:13));
  sim.alpha(.5).restart();
}

// ---------- 분야 칩 ----------
const rolesEl=document.getElementById("roles");
ROLES.forEach(r=>{
  const chip=document.createElement("div"); chip.className="role-chip on"; chip.dataset.id=r.id;
  chip.innerHTML=`<span class="dot"></span>${r.name}`;
  chip.addEventListener("click",()=>{
    if(selRoles.has(r.id)){selRoles.delete(r.id);chip.classList.remove("on");}
    else{selRoles.add(r.id);chip.classList.add("on");}
    recompute();
  });
  rolesEl.appendChild(chip);
});
document.getElementById("rAll").addEventListener("click",()=>{ selRoles=new Set(ROLES.map(r=>r.id));
  document.querySelectorAll(".role-chip").forEach(c=>c.classList.add("on")); recompute(); });
document.getElementById("rNone").addEventListener("click",()=>{ selRoles.clear();
  document.querySelectorAll(".role-chip").forEach(c=>c.classList.remove("on")); recompute(); });

// ---------- 연차 dual range ----------
const rmin=document.getElementById("rmin"), rmax=document.getElementById("rmax");
const fill=document.getElementById("fill"), rlab=document.getElementById("rlab");
function syncRange(){
  let a=+rmin.value, b=+rmax.value; if(a>b){[a,b]=[b,a];}
  yMin=a; yMax=b;
  fill.style.left=(a/30*100)+"%"; fill.style.width=((b-a)/30*100)+"%";
  rlab.textContent=`${a} ~ ${b>=30?"30년+":b+"년"}`;
  recompute();
}
rmin.addEventListener("input",syncRange); rmax.addEventListener("input",syncRange);

// ---------- 팝업 ----------
const popup=document.getElementById("popup");
let pinned=null;
function quotesFor(d){ return d.type==="sub"?(d.quotes||[]):SUBS.filter(s=>s.cat===d.id).flatMap(s=>s.quotes||[]).slice(0,4); }
function showPopup(d){
  const cat=catById[d.type==="cat"?d.id:d.cat]; const qs=quotesFor(d);
  popup.innerHTML=`<div class="pop-head"><div class="pop-cat" style="color:${cat.color}">${cat.name}${d.type==="sub"?" · 세부 역량":""}</div>
    <div class="pop-name">${d.name}</div><div class="pop-count">언급 <b>${(d.fcount||0).toLocaleString()}</b>명 (필터 적용)</div></div>
    <div class="pop-body"><div class="qlabel">실제 답변 (예시)</div>
    ${qs.map(q=>`<div class="quote" style="border-left-color:${cat.color}">${q.t}<span class="meta">— ${q.m}</span></div>`).join("")}</div>`;
  popup.style.opacity="1";
  const rect=svg.node().getBoundingClientRect();
  let px=rect.left+d.x+radius(d)+14, py=rect.top+d.y-40;
  if(px+290>window.innerWidth) px=rect.left+d.x-radius(d)-294;
  py=Math.max(10,Math.min(py,window.innerHeight-250));
  popup.style.left=px+"px"; popup.style.top=py+"px";
}
function highlight(d){ const keep=new Set([d.id]);
  if(d.type==="cat") subByCat[d.id].forEach(id=>keep.add(id)); else keep.add(d.cat);
  nodeG.attr("opacity",n=>keep.has(n.id)?1:.2);
  linkSel.attr("stroke-opacity",l=>(keep.has(l.source.id)&&keep.has(l.target.id))?.9:.06);
}
function unhighlight(){ nodeG.attr("opacity",1); linkSel.attr("stroke-opacity",.5); }
nodeG.on("mouseover",function(e,d){ if(pinned||(d.fcount||0)<=0)return; showPopup(d); highlight(d); })
  .on("mouseout",function(){ if(pinned)return; popup.style.opacity="0"; unhighlight(); })
  .on("click",function(e,d){ e.stopPropagation(); if((d.fcount||0)<=0)return;
    if(pinned===d.id){pinned=null;popup.style.opacity="0";unhighlight();}
    else{pinned=d.id;showPopup(d);highlight(d);} });
svg.on("click",e=>{ if(e.target===svg.node()){pinned=null;popup.style.opacity="0";unhighlight();} });

// ---------- 범례 ----------
const leg=document.getElementById("legend");
CATS.forEach(c=>{ const it=document.createElement("div"); it.className="legend-item";
  it.innerHTML=`<div class="legend-sw" style="background:${c.color}"></div>${c.name}`;
  it.addEventListener("mouseover",()=>{ if(!pinned)highlight(nodeById[c.id]); });
  it.addEventListener("mouseout",()=>{ if(!pinned)unhighlight(); });
  leg.appendChild(it); });

// init
recompute();
fill.style.width="100%";
</script>
</body>
</html>
